spring:
  application:
    name: travel-order-orchestrator
  liquibase:
    change-log: classpath:db/changelog/changelog-master.json
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
