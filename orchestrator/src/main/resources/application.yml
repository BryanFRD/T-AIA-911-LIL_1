spring:
  application:
    name: travel-order-orchestrator
    version: @project.version@
  liquibase:
    change-log: classpath:db/changelog/changelog-master.json
    enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
      show-components: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

mlflow:
  tracking-uri: https://mlflow.bryan-ferrando.fr
  model-alias: champion
  model-cache-dir: /tmp/djl-models
