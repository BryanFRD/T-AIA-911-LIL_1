spring:
  application:
    name: travel-order-orchestrator
    version: @project.version@
  liquibase:
    change-log: classpath:db/changelog/changelog-master.json
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  server:
    base-path: /
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

bean-config:
  tracking-uri: https://mlflow.bryan-ferrando.fr
  model-alias: champion
  model-cache-dir: /tmp/djl-models
  vosk-resource-path: models/vosk-model-small-fr-0.22
cors:
  allowed-origins: "*"
  allowed-methods:
    - POST
    - OPTIONS
  allowed-headers: "*"
  max-age: 3600

