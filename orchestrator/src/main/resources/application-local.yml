spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:travelorder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true

mlflow:
  tracking-uri: https://mlflow.bryan-ferrando.fr
  model-alias: latest
  model-cache-dir: /tmp/djl-models