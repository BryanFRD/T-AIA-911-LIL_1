image: maven:3.9.6-eclipse-temurin-21

stages:
  - lint
  - test
  - sonarqube
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest

cache:
  paths:
    - .m2/repository

check-code-style:
  stage: lint
  script:
    - mvn checkstyle:check
  allow_failure: true

run-tests:
  stage: test
  script:
    - mvn verify
  artifacts:
    reports:
      junit:
        - "*/target/surefire-reports/*.xml"
    paths:
      - "*/target/site/jacoco/jacoco.xml"
      - "*/target/surefire-reports/*.xml"
      - "*/target/classes/**"
      - "*/target/*.jar"
    expire_in: 1 hour

sonarqube-analysis:
  stage: sonarqube
  dependencies:
    - run-tests
  script:
    - mvn sonar:sonar -Dsonar.projectKey=t-aia-911_backend_0927f75a-637e-4c5d-af96-0d0efb1177df -Dsonar.projectName="T-AIA Backend" -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  only:
    - main
    - merge_requests
  allow_failure: true

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG

deploy-to-k8s:
  stage: deploy
  tags:
    - home-server
  image: bitnami/kubectl:latest
  script:
    - echo "🚀 Déploiement PROD..."
    - sed "s|__IMAGE_TAG__|$IMAGE_TAG|g" k8s/deployment.yaml | kubectl apply -f -
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl rollout restart deployment/travel-resolver
    - echo "✅ Déploiement terminé."
  only:
    - main