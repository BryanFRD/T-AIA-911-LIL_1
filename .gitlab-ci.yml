# ===============================
# Variables globales
# ===============================
variables:
  PIP_CACHE_DIR: "/cache/pip"
  HF_HOME: "/cache/huggingface"
  XDG_CACHE_HOME: "/cache"
  MODEL_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  MODEL_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  # Use CI-optimized configuration for training
  CONFIG_OVERRIDE: ""  # Override in specific jobs with config.ci.json

# ===============================
# Stages
# ===============================
stages:
  - init
  - train

# ===============================
# Base Python job
# ===============================
.python:
  image: pytorch/pytorch:2.0.1-cuda11.7-cudnn8-runtime
  before_script:
    - python --version
    - mkdir -p /cache/pip /cache/huggingface
    - export PIP_CACHE_DIR="/cache/pip"
    - export XDG_CACHE_HOME="/cache"
    - pip install --upgrade pip
    - pip install --cache-dir=/cache/pip --upgrade-strategy only-if-needed -r requirements.txt
    - python -c "import torch; print('CUDA:', torch.cuda.is_available(), 'GPUs:', torch.cuda.device_count(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else None)"

# ===============================
# INIT
# ===============================
init:sonarqube:
  stage: init
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

# ===============================
# TRAIN
# ===============================
train:nlu:
  stage: train
  tags:
    - gpu
  extends: .python
  variables:
    CONFIG_OVERRIDE: "nlu/config.ci.json"
  script:
    - python nlu/generate_from_templates.py
    - python nlu/train.py
    - python nlu/predict.py
  # Models are saved to MLflow - no local artifacts needed
  rules:
    - changes:
        - nlu/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual 

train:stt:
  stage: train
  tags:
    - gpu
  extends: .python
  script:
    - python stt/train.py
  # Models are saved to MLflow - no local artifacts needed
  rules:
    - changes:
        - stt/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual

train:tts:
  stage: train
  tags:
    - gpu
  extends: .python
  script:
    - python tts/train.py
  # Models are saved to MLflow - no local artifacts needed
  rules:
    - changes:
        - tts/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual

# ===============================
# PACKAGE
# ===============================
package:nlu:
  stage: package
  image: alpine:latest
  needs:
    - job: train:nlu
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - mkdir -p nlu/models
    - echo "{\"model_name\":\"nlu\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > nlu/models/metadata.json
    - find nlu/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz nlu/models/ nlu/data/cities.json nlu/data/templates.json common/
  artifacts:
    paths:
      - model.tar.gz
  rules:
    - changes:
        - nlu/**/*
        - common/**/*
        - .gitlab-ci.yml


package:stt:
  stage: package
  image: alpine:latest
  needs:
    - job: train:stt
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - find stt/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz stt/models/ common/
  artifacts:
    paths:
      - model.tar.gz
  rules:
    - changes:
        - stt/**/*
        - common/**/*
        - .gitlab-ci.yml

package:tts:
  stage: package
  image: alpine:latest
  needs:
    - job: train:tts
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - find tts/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz tts/models/ common/
  artifacts:
    paths:
      - model.tar.gz
  rules:
    - changes:
        - tts/**/*
        - common/**/*
        - .gitlab-ci.yml

# ===============================
# RELEASE - Upload to Package Registry
# ===============================
release:nlu:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:nlu
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file model.tar.gz \
           "${MODEL_REGISTRY_URL}/nlu-model/${MODEL_VERSION}/nlu-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual

release:stt:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:stt
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file model.tar.gz \
           "${MODEL_REGISTRY_URL}/stt-model/${MODEL_VERSION}/stt-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual

release:tts:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:tts
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file model.tar.gz \
           "${MODEL_REGISTRY_URL}/tts-model/${MODEL_VERSION}/tts-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual
