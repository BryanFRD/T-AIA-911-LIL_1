# ===============================
# Variables globales
# ===============================
variables:
  PIP_CACHE_DIR: "/cache/pip"
  HF_HOME: "/cache/huggingface"
  XDG_CACHE_HOME: "/cache"
  MODEL_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  MODEL_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

# ===============================
# Stages
# ===============================
stages:
  - init
  - train
  - package
  - release

# ===============================
# Base Python job
# ===============================
.python:
  image: pytorch/pytorch:2.0.1-cuda11.7-cudnn8-runtime
  before_script:
    - python --version
    - mkdir -p /cache/pip /cache/huggingface
    - export PIP_CACHE_DIR="/cache/pip"
    - export XDG_CACHE_HOME="/cache"
    - pip install --upgrade pip
    # Installer torch et torchvision depuis l'index PyTorch
    - pip install --cache-dir=/cache/pip --upgrade-strategy only-if-needed torch==2.0.1+cu117 torchvision==0.15.2+cu117 --index-url https://download.pytorch.org/whl/cu117
    # Installer le reste depuis PyPI normal
    - pip install --cache-dir=/cache/pip --upgrade-strategy only-if-needed numpy==1.26.4 transformers==4.30.2 datasets==4.4.1 accelerate==1.12.0 huggingface-hub==0.36.0 pyarrow==22.0.0 scikit-learn>=1.3.0 pytorch-crf>=0.7.2
    - python -c "import torch; print('CUDA:', torch.cuda.is_available(), 'GPUs:', torch.cuda.device_count(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else None)"

# ===============================
# INIT
# ===============================
init:sonarqube:
  stage: init
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

# ===============================
# TRAIN
# ===============================
train:nlu:
  stage: train
  tags:
    - gpu
  extends: .python
  script:
    - python nlu/generate_from_templates.py
    - python nlu/train.py
    - python nlu/predict.py
  artifacts:
    paths:
      # Modèles finaux uniquement (pas les checkpoints)
      - nlu/models/model_ner/*.bin
      - nlu/models/model_ner/*.json
      - nlu/models/model_ner/*.txt
      - nlu/models/model_ner/*.onnx
      - nlu/models/model_ner/*.pt
      - nlu/models/model_intent/*.bin
      - nlu/models/model_intent/*.json
      - nlu/models/model_intent/*.txt
      - nlu/models/model_intent/*.onnx
      - nlu/models/model_intent/*.pt
      # Optionnel: données générées pour debugging
      # - nlu/data/train_generated.json
    expire_in: 7 days
  rules:
    - changes:
        - nlu/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual 

train:stt:
  stage: train
  tags:
    - gpu
  extends: .python
  script:
    - python stt/train.py
  artifacts:
    paths:
      # Modèles finaux (avec sous-dossiers)
      - stt/models/**/*.bin
      - stt/models/**/*.json
      - stt/models/**/*.txt
      - stt/models/**/*.onnx
      - stt/models/**/*.pt
    expire_in: 7 days
  rules:
    - changes:
        - stt/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual

train:tts:
  stage: train
  tags:
    - gpu
  extends: .python
  script:
    - python tts/train.py
  artifacts:
    paths:
      # Modèles finaux (avec sous-dossiers)
      - tts/models/**/*.bin
      - tts/models/**/*.json
      - tts/models/**/*.txt
      - tts/models/**/*.onnx
      - tts/models/**/*.pt
    expire_in: 7 days
  rules:
    - changes:
        - tts/**/*
        - common/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual

# ===============================
# PACKAGE
# ===============================
package:nlu:
  stage: package
  image: alpine:latest
  needs:
    - job: train:nlu
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - mkdir -p nlu/models
    - echo "{\"model_name\":\"nlu\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > nlu/models/metadata.json
    - find nlu/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz nlu/models/ nlu/data/cities.json nlu/data/templates.json common/
  artifacts:
    paths:
      - model.tar.gz
  model:
    name: nlu-model
    version: $MODEL_VERSION
    path: model.tar.gz
  rules:
    - changes:
        - nlu/**/*
        - common/**/*
        - .gitlab-ci.yml


package:stt:
  stage: package
  image: alpine:latest
  needs:
    - job: train:stt
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - mkdir -p stt/models
    - echo "{\"model_name\":\"stt\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > stt/models/metadata.json
    - find stt/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz stt/models/ common/
  artifacts:
    paths:
      - model.tar.gz
  model:
    name: stt-model
    version: $MODEL_VERSION
    path: model.tar.gz
  rules:
    - changes:
        - stt/**/*
        - common/**/*
        - .gitlab-ci.yml

package:tts:
  stage: package
  image: alpine:latest
  needs:
    - job: train:tts
      artifacts: true
  before_script:
    - apk add --no-cache tar gzip
  script:
    - mkdir -p tts/models
    - echo "{\"model_name\":\"tts\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > tts/models/metadata.json
    - find tts/models -type d -name "checkpoint-*" -exec rm -rf {} + || true
    - tar -czf model.tar.gz tts/models/ common/
  artifacts:
    paths:
      - model.tar.gz
  model:
    name: tts-model
    version: $MODEL_VERSION
    path: model.tar.gz
  rules:
    - changes:
        - tts/**/*
        - common/**/*
        - .gitlab-ci.yml
