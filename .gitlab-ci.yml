variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "/cache/pip"
  XDG_CACHE_HOME: "/cache"
  MODEL_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  MODEL_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

stages:
  - install
  - test
  - train
  - package
  - release

.python_base:
  image: python:${PYTHON_VERSION}
  before_script:
    - python --version
    - mkdir -p /cache/pip /cache/venv
    - export PIP_CACHE_DIR="/cache/pip"
    - export XDG_CACHE_HOME="/cache"
    - pip install --upgrade pip
    - python -m venv /cache/venv
    - source /cache/venv/bin/activate

.install_dependencies:
  extends: .python_base
  script:
    - pip install --cache-dir=/cache/pip -r requirements.txt

install:dependencies:
  stage: install
  extends: .install_dependencies
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test:lint:
  stage: test
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - pip install flake8 pylint
    - flake8 nlu/ stt/ tts/ common/ --max-line-length=120 --exclude=venv,__pycache__ || true
    - pylint nlu/ stt/ tts/ common/ --disable=all --enable=E,F || true
  rules:
    - if: $CI_COMMIT_BRANCH

test:sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

train:nlu:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python nlu/generate_from_templates.py
    - python nlu/train.py
    - python nlu/predict.py
  artifacts:
    paths:
      - nlu/models/
      - nlu/data/train_generated.json
    expire_in: 7 days
  rules:
    - changes:
        - nlu/**/*
        - .gitlab-ci.yml
  when: manual

train:stt:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python stt/train.py
  artifacts:
    paths:
      - stt/models/
    expire_in: 7 days
  rules:
    - changes:
        - stt/**/*
        - .gitlab-ci.yml
  when: manual

train:tts:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python tts/train.py
  artifacts:
    paths:
      - tts/models/
    expire_in: 7 days
  rules:
    - changes:
        - tts/**/*
        - .gitlab-ci.yml
  when: manual

package:nlu:
  stage: package
  image: alpine:latest
  needs:
    - job: train:nlu
      artifacts: true
  dependencies:
    - train:nlu
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"nlu\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > nlu/models/metadata.json
    - tar -czf nlu-model-${MODEL_VERSION}.tar.gz -C nlu models/ data/cities.json data/templates.json
  artifacts:
    paths:
      - nlu-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  rules:
    - changes:
        - nlu/**/*
        - .gitlab-ci.yml

package:stt:
  stage: package
  image: alpine:latest
  needs:
    - job: train:stt
      artifacts: true
  dependencies:
    - train:stt
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"stt\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > stt/models/metadata.json
    - tar -czf stt-model-${MODEL_VERSION}.tar.gz -C stt models/
  artifacts:
    paths:
      - stt-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  rules:
    - changes:
        - stt/**/*
        - .gitlab-ci.yml

package:tts:
  stage: package
  image: alpine:latest
  needs:
    - job: train:tts
      artifacts: true
  dependencies:
    - train:tts
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"tts\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > tts/models/metadata.json
    - tar -czf tts-model-${MODEL_VERSION}.tar.gz -C tts models/
  artifacts:
    paths:
      - tts-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  rules:
    - changes:
        - tts/**/*
        - .gitlab-ci.yml

release:nlu:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:nlu
      artifacts: true
  script: >
    curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
    --upload-file nlu-model-${MODEL_VERSION}.tar.gz
    "${MODEL_REGISTRY_URL}/nlu-model/${MODEL_VERSION}/nlu-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

release:stt:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:stt
      artifacts: true
  script: >
    curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
    --upload-file stt-model-${MODEL_VERSION}.tar.gz
    "${MODEL_REGISTRY_URL}/stt-model/${MODEL_VERSION}/stt-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

release:tts:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: package:tts
      artifacts: true
  script: >
    curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
    --upload-file tts-model-${MODEL_VERSION}.tar.gz
    "${MODEL_REGISTRY_URL}/tts-model/${MODEL_VERSION}/tts-model-${MODEL_VERSION}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

release:notes:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "release ${MODEL_VERSION}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    description: "AI Models Release ${MODEL_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG
