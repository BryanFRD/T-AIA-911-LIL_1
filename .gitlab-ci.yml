variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MODEL_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  MODEL_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"

stages:
  - install
  - test
  - train
  - package
  - release

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - venv/

.python_base:
  image: python:${PYTHON_VERSION}
  before_script:
    - python --version
    - pip install --upgrade pip
    - python -m venv venv
    - source venv/bin/activate

.install_dependencies:
  extends: .python_base
  script:
    - pip install -r requirements.txt

install:dependencies:
  stage: install
  extends: .install_dependencies
  artifacts:
    paths:
      - venv/
    expire_in: 1 day
  only:
    - merge_requests
    - main
    - tags

test:lint:
  stage: test
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - pip install flake8 pylint
    - flake8 nlu/ stt/ tts/ common/ --max-line-length=120 --exclude=venv,__pycache__ || true
    - pylint nlu/ stt/ tts/ common/ --disable=all --enable=E,F || true
  only:
    - merge_requests
    - main

test:sonarqube:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
    - main

train:nlu:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python nlu/generate_from_templates.py
    - python nlu/train.py
    - python nlu/predict.py
  artifacts:
    paths:
      - nlu/models/
      - nlu/data/train_generated.json
    expire_in: 7 days
  only:
    changes:
      - nlu/**/*
      - .gitlab-ci.yml
  when: manual
  tags:
    - docker

train:stt:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python stt/train.py
  artifacts:
    paths:
      - stt/models/
    expire_in: 7 days
  only:
    changes:
      - stt/**/*
      - .gitlab-ci.yml
  when: manual
  tags:
    - docker

train:tts:
  stage: train
  extends: .python_base
  dependencies:
    - install:dependencies
  script:
    - source venv/bin/activate
    - python tts/train.py
  artifacts:
    paths:
      - tts/models/
    expire_in: 7 days
  only:
    changes:
      - tts/**/*
      - .gitlab-ci.yml
  when: manual
  tags:
    - docker

package:nlu:
  stage: package
  image: alpine:latest
  dependencies:
    - train:nlu
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"nlu\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > nlu/models/metadata.json
    - tar -czf nlu-model-${MODEL_VERSION}.tar.gz -C nlu models/ data/cities.json data/templates.json
  artifacts:
    paths:
      - nlu-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  only:
    changes:
      - nlu/**/*
      - .gitlab-ci.yml

package:stt:
  stage: package
  image: alpine:latest
  dependencies:
    - train:stt
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"stt\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > stt/models/metadata.json
    - tar -czf stt-model-${MODEL_VERSION}.tar.gz -C stt models/
  artifacts:
    paths:
      - stt-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  only:
    changes:
      - stt/**/*
      - .gitlab-ci.yml

package:tts:
  stage: package
  image: alpine:latest
  dependencies:
    - train:tts
  before_script:
    - apk add --no-cache tar gzip
  script:
    - echo "{\"model_name\":\"tts\",\"version\":\"${MODEL_VERSION}\",\"commit\":\"${CI_COMMIT_SHA}\",\"branch\":\"${CI_COMMIT_REF_NAME}\",\"pipeline_id\":\"${CI_PIPELINE_ID}\",\"created_at\":\"$(date -Iseconds)\"}" > tts/models/metadata.json
    - tar -czf tts-model-${MODEL_VERSION}.tar.gz -C tts models/
  artifacts:
    paths:
      - tts-model-${MODEL_VERSION}.tar.gz
    expire_in: 30 days
  only:
    changes:
      - tts/**/*
      - .gitlab-ci.yml

release:nlu:
  stage: release
  image: curlimages/curl:latest
  dependencies:
    - package:nlu
  script:
    - curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file nlu-model-${MODEL_VERSION}.tar.gz "${MODEL_REGISTRY_URL}/nlu-model/${MODEL_VERSION}/nlu-model-${MODEL_VERSION}.tar.gz"
  only:
    - tags
    - main
  needs:
    - package:nlu

release:stt:
  stage: release
  image: curlimages/curl:latest
  dependencies:
    - package:stt
  script:
    - curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file stt-model-${MODEL_VERSION}.tar.gz "${MODEL_REGISTRY_URL}/stt-model/${MODEL_VERSION}/stt-model-${MODEL_VERSION}.tar.gz"
  only:
    - tags
    - main
  needs:
    - package:stt

release:tts:
  stage: release
  image: curlimages/curl:latest
  dependencies:
    - package:tts
  script:
    - curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file tts-model-${MODEL_VERSION}.tar.gz "${MODEL_REGISTRY_URL}/tts-model/${MODEL_VERSION}/tts-model-${MODEL_VERSION}.tar.gz"
  only:
    - tags
    - main
  needs:
    - package:tts

release:notes:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "release ${MODEL_VERSION}"
  release:
    tag_name: "${CI_COMMIT_TAG}"
    description: |
      AI Models Release ${MODEL_VERSION}
  only:
    - tags
