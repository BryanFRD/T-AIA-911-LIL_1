# SonarQube Server URL (update with your SonarQube instance URL)
sonar.host.url=https://sonarqube.bryan-ferrando.fr

# Project identification
sonar.projectKey=t-aia-911_mobile_e86fd24e-e675-44ed-9e3f-5826a56a6d1c

# Project metadata
sonar.projectName=T-AIA Mobile
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts

# TypeScript specific
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions (files not to include in coverage)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.d.ts,**/types/**

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git
