# ==================================
# Informations du projet
# ==================================

sonar.projectKey=t-aia-911_models_71a4a1e4-86b1-45b9-b25a-509ad479e417
sonar.projectName=T-AIA Models
sonar.projectVersion=1.0.0
sonar.projectDescription=Projet d'IA comprenant des modèles NLU, STT et TTS

# ==================================
# Chemins des sources
# ==================================

sonar.sources=nlu,stt,tts
sonar.sourceEncoding=UTF-8

# Exclusions globales
sonar.exclusions=\
    **/__pycache__/**,\
    **/.*,\
    **/node_modules/**,\
    **/venv/**,\
    **/env/**,\
    **/.venv/**,\
    **/models/**,\
    **/model_*/**,\
    **/logs/**,\
    **/*.pyc,\
    **/*.pyo,\
    **/*.egg-info/**,\
    **/dist/**,\
    **/build/**,\
    **/.pytest_cache/**,\
    **/.coverage,\
    **/htmlcov/**,\
    **/*.json

# ==================================
# Configuration Python
# ==================================

sonar.python.version=3.8,3.9,3.10,3.11,3.12

# ==================================
# Analyse statique
# ==================================

# Profil de qualité
# sonar.profile=Sonar way

# Niveau de sévérité minimum pour les issues
# sonar.issue.ignore.multicriteria=e1,e2

# ==================================
# Paramètres de duplication
# ==================================

sonar.cpd.python.minimumTokens=50

# ==================================
# Paramètres d'analyse
# ==================================

sonar.log.level=INFO
sonar.verbose=false

# ==================================
# Liens externes (optionnel)
# ==================================

sonar.links.scm=https://gitlab.com/your-org/models
sonar.links.ci=https://gitlab.com/your-org/models/-/pipelines
sonar.links.homepage=https://your-docs.com
sonar.links.issue=https://gitlab.com/your-org/models/-/issues

# ==================================
# Configuration SCM (Git)
# ==================================

sonar.scm.disabled=false
sonar.scm.provider=git

# ==================================
# Configuration avancée
# ==================================

sonar.ws.timeout=300
sonar.cpd.threads=4
sonar.python.file.suffixes=.py

# ==================================
# Désactivation de certaines règles
# ==================================

sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/train.py

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S109
sonar.issue.ignore.multicriteria.e2.resourceKey=**/train.py

sonar.issue.ignore.multicriteria.e3.ruleKey=python:S138
sonar.issue.ignore.multicriteria.e3.resourceKey=**/train.py

sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2228
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.py
