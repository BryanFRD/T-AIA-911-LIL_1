# ==================================
# Informations du projet
# ==================================

# Clé unique du projet (obligatoire)
# Format recommandé: organization:project-name
sonar.projectKey=t-aia-911_models_71a4a1e4-86b1-45b9-b25a-509ad479e417

# Nom affiché dans SonarQube
sonar.projectName=T-AIA Models

# Version du projet
sonar.projectVersion=1.0.0

# Description du projet
sonar.projectDescription=Projet d'IA comprenant des modèles NLU, STT et TTS

# ==================================
# Chemins des sources
# ==================================

# Répertoires contenant le code source à analyser
sonar.sources=nlu,stt,tts,common

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# ==================================
# Chemins d'exclusion
# ==================================

# Exclusions globales (patterns)
sonar.exclusions=\
    **/__pycache__/**,\
    **/.*,\
    **/node_modules/**,\
    **/venv/**,\
    **/env/**,\
    **/.venv/**,\
    **/models/**,\
    **/model_*/**,\
    **/logs/**,\
    **/*.pyc,\
    **/*.pyo,\
    **/*.egg-info/**,\
    **/dist/**,\
    **/build/**,\
    **/.pytest_cache/**,\
    **/.coverage,\
    **/htmlcov/**,\
    **/*.json

# Exclusions pour les tests
sonar.test.exclusions=\
    **/test_*.py,\
    **/*_test.py,\
    **/tests/**

# Exclusions pour la couverture de code
sonar.coverage.exclusions=\
    **/test_*.py,\
    **/*_test.py,\
    **/tests/**,\
    **/train.py,\
    **/__init__.py

# ==================================
# Configuration Python
# ==================================

# Version Python (optionnel)
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# ==================================
# Tests et couverture de code
# ==================================

# Répertoires de tests
sonar.tests=tests

# Format des rapports de couverture (si disponible)
# sonar.python.coverage.reportPaths=coverage.xml

# Format des rapports de tests (si disponible)
# sonar.python.xunit.reportPath=test-reports/xunit-result.xml

# ==================================
# Analyse statique
# ==================================

# Profil de qualité (optionnel)
# sonar.profile=Sonar way

# Niveau de sévérité minimum pour les issues
# sonar.issue.ignore.multicriteria=e1,e2

# Ignorer certaines règles spécifiques (exemples)
# sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# ==================================
# Paramètres de duplication
# ==================================

# Taille minimale du bloc pour la détection de duplication
sonar.cpd.python.minimumTokens=50

# ==================================
# Paramètres d'analyse
# ==================================

# Niveau de log
# sonar.log.level=INFO

# Mode verbose
# sonar.verbose=false

# ==================================
# Liens externes (optionnel)
# ==================================

# Lien vers le dépôt Git
# sonar.links.scm=https://gitlab.com/your-org/models

# Lien vers la CI
# sonar.links.ci=https://gitlab.com/your-org/models/-/pipelines

# Lien vers la documentation
# sonar.links.homepage=https://your-docs.com

# Lien vers le bug tracker
# sonar.links.issue=https://gitlab.com/your-org/models/-/issues

# ==================================
# Configuration SCM (Git)
# ==================================

# Désactiver l'analyse SCM si problématique
# sonar.scm.disabled=false

# Provider SCM
# sonar.scm.provider=git

# ==================================
# Configuration avancée
# ==================================

# Timeout pour l'analyse (en secondes)
# sonar.ws.timeout=300

# Nombre de threads pour l'analyse
# sonar.cpd.threads=4

# Taille maximale des fichiers analysés (en Ko)
# sonar.python.file.suffixes=.py

# ==================================
# Désactivation de certaines règles
# ==================================

# Exemples de règles que vous pourriez vouloir désactiver
# pour un projet d'IA/ML (décommentez si nécessaire)

# Désactiver la règle sur la complexité cognitive
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/train.py

# Désactiver la règle sur les "magic numbers" pour les modèles
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S109
sonar.issue.ignore.multicriteria.e2.resourceKey=**/train.py

# Désactiver la règle sur les fonctions trop longues
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S138
sonar.issue.ignore.multicriteria.e3.resourceKey=**/train.py

# Désactiver la règle sur les print statements (utiles pour ML)
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2228
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.py
