spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:travelorder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    root: INFO
    com.epitech.travelorder.gtfs: DEBUG
    org.springframework.batch: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

