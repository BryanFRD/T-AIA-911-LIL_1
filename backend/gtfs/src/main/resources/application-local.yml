spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/gtfs-shared;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO
    com.epitech.travelorder.gtfs: DEBUG
    org.springframework.batch: DEBUG
    org.springframework.boot.autoconfigure: DEBUG

