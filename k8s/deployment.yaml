apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-resolver
  labels:
    app: travel-resolver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: travel-resolver
  template:
    metadata:
      labels:
        app: travel-resolver
    spec:
      imagePullSecrets:
        - name: gitlab-auth
      containers:
        - name: travel-resolver
          image: __IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
              nvidia.com/gpu: 1
            requests:
              memory: "1Gi"
              cpu: "500m"
              nvidia.com/gpu: 1